<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a211a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Living Parchment</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23b8342a'/%3E%3Cpath d='M18 40c8-14 20-18 28-14' stroke='%23f3e6c8' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="Parchment drawing surface"></canvas>

    <div id="hint" class="hint" aria-live="polite">
      <span>Draw a <b>loop</b> to raise a hill</span>
      <span>Sharp corners build a <b>ruin</b></span>
      <span>An open line carves a <b>river</b></span>
      <span><b>Tap</b> to plant · two fingers to turn the page</span>
    </div>

    <nav id="toolbar" class="toolbar" aria-label="Tools">
      <div class="biomes" role="radiogroup" aria-label="Biome">
        <button class="stamp biome" data-biome="mossyRuin" role="radio" aria-checked="true" title="Mossy Ruin (1)">苔</button>
        <button class="stamp biome" data-biome="autumnRidge" role="radio" aria-checked="false" title="Autumn Ridge (2)">秋</button>
        <button class="stamp biome" data-biome="moonlitTide" role="radio" aria-checked="false" title="Moonlit Tide (3)">月</button>
      </div>
      <div class="actions">
        <button class="stamp tool" id="undo" title="Undo stroke (Ctrl+Z)" aria-label="Undo stroke" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4V2M4.6 7.2A8 8 0 1 1 4 13" /></svg>
        </button>
        <button class="stamp tool" id="clear" title="Clear page" aria-label="Clear page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M9 6V4h6v2M7 6l1 14h8l1-14" /></svg>
        </button>
      </div>
    </nav>
    <div id="biome-name" class="biome-name" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
